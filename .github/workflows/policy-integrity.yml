name: Policy integrity

# This workflow intentionally runs ONLY trusted base-branch code. It reads
# candidate PR diff metadata, but NEVER checks out or executes PR scripts.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  trust-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch untrusted PR commit as data only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git -c protocol.version=2 fetch --no-tags origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pr-head"
      - name: Verify independent approval on latest head
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'policy-approved') }}
        shell: bash
        run: |
          set -euo pipefail
          independent=false
          if [[ "$POLICY_APPROVED" == "true" ]]; then
            reviews="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews")"
            while IFS= read -r reviewer; do
              [[ -n "$reviewer" ]] || continue
              permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq .permission 2>/dev/null || true)"
              case "$permission" in
                write|maintain|admin) independent=true; break ;;
              esac
            done < <(printf '%s\n' "$reviews" | jq -r \
              --arg author "$PR_AUTHOR" --arg head "$PR_HEAD_SHA" \
              '.[] | select(.state == "APPROVED" and .commit_id == $head and .user.login != $author) | .user.login')
          fi
          echo "independent_approved=$independent" >> "$GITHUB_OUTPUT"
      - name: Check protected file diff using base-side validator
        env:
          POLICY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'policy-approved') }}
          POLICY_INDEPENDENT_APPROVED: ${{ steps.approval.outputs.independent_approved }}
        run: |
          bash scripts/check-policy-trust-boundary.sh HEAD refs/remotes/pr-head
