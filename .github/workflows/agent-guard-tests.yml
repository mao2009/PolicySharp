name: Agent guard regression tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify MSBuild participation fixtures
        run: python -m unittest discover -s tests/agent_guard -p 'test_analyzer_participation.py' -v
      - name: Verify real MSBuild evaluation and missing analyzer rejection
        run: python -m unittest discover -s tests/agent_guard -p 'test_msbuild_live.py' -v
      - name: Test independent-approval guard contract
        run: python -m unittest discover -s tests/agent_guard -p 'test_policy_approval_gate.py' -v
      - name: Run offline strict gate fixture tests
        run: python -m unittest discover -s tests/agent_guard -p 'test_strict_diagnostic_audit.py' -v
      - name: Run offline agent feedback fixture tests
        run: python -m unittest discover -s tests/agent_guard -p 'test_agent_diagnostic_feedback.py' -v
      - name: Real PolicySharp NuGet + CLI consumer gate
        run: bash tests/agent_guard/verify_policysharp_feedback.sh
