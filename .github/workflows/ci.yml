name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PolicySharp.sln
      - name: Build
        run: dotnet build PolicySharp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PolicySharp.sln --configuration Release --no-build
