name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PolicySharp.sln
      - name: Build
        run: dotnet build PolicySharp.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PolicySharp.sln --configuration Release --no-build
      - name: Pack analyzer
        run: dotnet pack src/PolicySharp.Analyzers/PolicySharp.Analyzers.csproj --configuration Release --no-build --output artifacts
      - name: Inspect package
        run: |
          unzip -l artifacts/PolicySharp.Analyzers.*.nupkg | tee package-contents.txt
          grep -q "analyzers/dotnet/cs/PolicySharp.Analyzers.dll" package-contents.txt
          grep -q "analyzers/dotnet/cs/PolicySharp.Core.dll" package-contents.txt
          grep -q "buildTransitive/PolicySharp.Analyzers.props" package-contents.txt
